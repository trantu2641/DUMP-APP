name: Build SHAHierarchyDump RootHide

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          set -e
          brew update
          brew install ldid

      - name: Install RootHide Theos
        run: |
          set -e

          git clone --recursive \
            https://github.com/roothide/theos.git \
            "$GITHUB_WORKSPACE/theos"

          echo "THEOS=$GITHUB_WORKSPACE/theos" \
            >> "$GITHUB_ENV"

      - name: Download SDKs
        run: |
          set -e

          git clone --depth 1 \
            https://github.com/theos/sdks.git \
            "$GITHUB_WORKSPACE/sdks"

      - name: Install iPhoneOS SDK
        run: |
          set -e

          mkdir -p "$THEOS/sdks"

          SDK=$(find "$GITHUB_WORKSPACE/sdks" \
            -maxdepth 1 \
            -type d \
            -name "iPhoneOS*.sdk" \
            | sort -V \
            | tail -n 1)

          test -n "$SDK"

          echo "Using SDK:"
          echo "$SDK"

          cp -R "$SDK" "$THEOS/sdks/"

      - name: Build RootHide DEB
        run: |
          set -e

          export THEOS="$GITHUB_WORKSPACE/theos"

          make clean

          make package \
            FINALPACKAGE=1 \
            THEOS_PACKAGE_SCHEME=roothide

      # ==========================================
      # HARD CHECK PACKAGE
      # ==========================================

      - name: Verify DEB structure
        run: |
          set -e

          DEB=$(find packages \
            -type f \
            -name "*.deb" \
            | head -n 1)

          if [ -z "$DEB" ]; then
            echo "ERROR: DEB not generated"
            exit 1
          fi

          echo "======================================"
          echo "DEB:"
          echo "$DEB"
          echo "======================================"

          echo
          echo "PACKAGE CONTENT:"
          dpkg-deb -c "$DEB"

          echo
          echo "======================================"
          echo "CHECK DYLIB"
          echo "======================================"

          if ! dpkg-deb -c "$DEB" | grep -q "SHAHierarchyDump.dylib"; then
            echo "ERROR: SHAHierarchyDump.dylib NOT FOUND IN DEB"
            exit 1
          fi

          echo "OK: dylib found"

          echo
          echo "======================================"
          echo "CHECK PLIST"
          echo "======================================"

          if ! dpkg-deb -c "$DEB" | grep -q "SHAHierarchyDump.plist"; then
            echo "ERROR: SHAHierarchyDump.plist NOT FOUND IN DEB"
            exit 1
          fi

          echo "OK: plist found"

          echo
          echo "======================================"
          echo "EXTRACT PACKAGE"
          echo "======================================"

          rm -rf /tmp/shadump
          mkdir -p /tmp/shadump

          dpkg-deb -x "$DEB" /tmp/shadump

          find /tmp/shadump \
            -type f \
            -print

          echo
          echo "======================================"
          echo "PLIST LOCATION"
          echo "======================================"

          find /tmp/shadump \
            -name "SHAHierarchyDump.plist" \
            -print

          echo
          echo "======================================"
          echo "DYLIB INFORMATION"
          echo "======================================"

          find /tmp/shadump \
            -name "SHAHierarchyDump.dylib" \
            -exec file {} \;

      - name: Upload DEB
        uses: actions/upload-artifact@v4
        with:
          name: SHAHierarchyDump-RootHide-DEB
          path: packages/*.deb
          if-no-files-found: error
