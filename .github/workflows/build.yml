name: Build SHAHierarchyDump RootHide

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          set -e
          brew update
          brew install ldid

      - name: Install RootHide Theos
        run: |
          set -e

          git clone --recursive \
            https://github.com/roothide/theos.git \
            "$GITHUB_WORKSPACE/theos"

          echo "THEOS=$GITHUB_WORKSPACE/theos" \
            >> "$GITHUB_ENV"

      - name: Install iPhoneOS 16.5 SDK
        run: |
          set -e

          mkdir -p "$THEOS/sdks"

          git clone --depth 1 \
            https://github.com/theos/sdks.git \
            "$GITHUB_WORKSPACE/sdks"

          SDK="$GITHUB_WORKSPACE/sdks/iPhoneOS16.5.sdk"

          if [ ! -d "$SDK" ]; then
            echo "ERROR: iPhoneOS16.5.sdk not found"
            find "$GITHUB_WORKSPACE/sdks" \
              -maxdepth 2 \
              -type d \
              -name "*.sdk"
            exit 1
          fi

          cp -R "$SDK" "$THEOS/sdks/"

          echo "Using:"
          ls -ld "$THEOS/sdks/iPhoneOS16.5.sdk"

      - name: Build
        run: |
          set -e

          export THEOS="$GITHUB_WORKSPACE/theos"

          make clean

          make package \
            FINALPACKAGE=1 \
            THEOS_PACKAGE_SCHEME=roothide

      - name: Inspect DEB
        run: |
          set -e

          DEB=$(find packages \
            -type f \
            -name "*.deb" \
            | head -n 1)

          if [ -z "$DEB" ]; then
            echo "ERROR: no DEB"
            exit 1
          fi

          echo "================================"
          echo "DEB"
          echo "================================"
          echo "$DEB"

          file "$DEB"

          rm -rf /tmp/sha-deb
          mkdir -p /tmp/sha-deb

          cd /tmp/sha-deb

          ar -x "$GITHUB_WORKSPACE/$DEB"

          echo
          echo "================================"
          echo "CONTROL"
          echo "================================"

          tar -xOf control.tar.* ./control

          echo
          echo "================================"
          echo "PACKAGE CONTENT"
          echo "================================"

          mkdir root

          tar -xf data.tar.* -C root

          find root \
            -type f \
            -o -type l \
            | sort

          echo
          echo "================================"
          echo "CHECK DYLIB"
          echo "================================"

          DYLIB=$(find root \
            -name "SHAHierarchyDump.dylib" \
            | head -n 1)

          test -n "$DYLIB"

          echo "FOUND:"
          echo "$DYLIB"

          echo
          echo "================================"
          echo "CHECK PLIST"
          echo "================================"

          PLIST=$(find root \
            -name "SHAHierarchyDump.plist" \
            | head -n 1)

          test -n "$PLIST"

          echo "FOUND:"
          echo "$PLIST"

          echo
          echo "================================"
          echo "CHECK INSTALL DIRECTORY"
          echo "================================"

          EXPECTED="root/Library/MobileSubstrate/DynamicLibraries"

          test -f \
            "$EXPECTED/SHAHierarchyDump.dylib"

          test -f \
            "$EXPECTED/SHAHierarchyDump.plist"

          echo "PASS:"
          echo "$EXPECTED/SHAHierarchyDump.dylib"
          echo "$EXPECTED/SHAHierarchyDump.plist"

          echo
          echo "================================"
          echo "PLIST"
          echo "================================"

          cat "$EXPECTED/SHAHierarchyDump.plist"

          echo
          echo "================================"
          echo "SUCCESS"
          echo "================================"

      - name: Upload DEB
        uses: actions/upload-artifact@v4
        with:
          name: SHAHierarchyDump-RootHide
          path: packages/*.deb
          if-no-files-found: error
