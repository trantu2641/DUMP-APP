name: Build SHAHierarchyDump

on:
  workflow_dispatch:


jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            clang \
            git \
            curl \
            wget \
            unzip \
            xz-utils \
            fakeroot \
            perl \
            ldid \
            dpkg-dev

      - name: Install Theos
        run: |
          export THEOS="$HOME/theos"

          git clone --recursive --depth=1 \
            https://github.com/theos/theos.git \
            "$THEOS"

          echo "THEOS=$THEOS" >> "$GITHUB_ENV"

      - name: Install iOS toolchain
        run: |
          cd "$THEOS"

          echo "Installing Theos iOS toolchain..."

          mkdir -p "$THEOS/toolchain"

          curl -L \
            --fail \
            --retry 3 \
            -o /tmp/iOSToolchain.tar.xz \
            https://github.com/theos/llvm-project/releases/latest/download/iOSToolchain.tar.xz

          file /tmp/iOSToolchain.tar.xz

          tar -xJf /tmp/iOSToolchain.tar.xz \
            -C "$THEOS/toolchain"

      - name: Install iOS SDK
        run: |
          mkdir -p "$THEOS/sdks"

          git clone --depth=1 \
            https://github.com/theos/sdks.git \
            /tmp/theos-sdks

          echo "Available SDKs:"
          find /tmp/theos-sdks \
            -maxdepth 1 \
            -type d \
            -name 'iPhoneOS*.sdk' \
            -print

          if [ -d "/tmp/theos-sdks/iPhoneOS16.5.sdk" ]; then
            cp -R \
              "/tmp/theos-sdks/iPhoneOS16.5.sdk" \
              "$THEOS/sdks/"
          else
            echo "iPhoneOS16.5.sdk not found."
            exit 1
          fi

      - name: Verify Theos
        run: |
          echo "======================================"
          echo "THEOS"
          echo "======================================"

          echo "$THEOS"

          echo
          echo "======================================"
          echo "SDK"
          echo "======================================"

          find "$THEOS/sdks" \
            -maxdepth 1 \
            -type d \
            -name '*.sdk' \
            -print

          echo
          echo "======================================"
          echo "CLANG"
          echo "======================================"

          "$THEOS/toolchain/linux/iphone/bin/clang" \
            --version

      - name: Build
        run: |
          make clean
          make package FINALPACKAGE=1

      - name: List output
        run: |
          echo "======================================"
          echo "BUILD OUTPUT"
          echo "======================================"

          find . \
            -type f \
            \( \
              -name "*.deb" \
              -o \
              -name "*.dylib" \
            \) \
            -print

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: SHAHierarchyDump
          path: |
            packages/*.deb
            packages/*.dylib
          if-no-files-found: error
