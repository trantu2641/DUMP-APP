name: Build SHAHierarchyDump RootHide

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:

      # ==========================================
      # CHECKOUT
      # ==========================================

      - name: Checkout
        uses: actions/checkout@v4


      # ==========================================
      # DEPENDENCIES
      # ==========================================

      - name: Install dependencies
        run: |
          set -e

          brew update
          brew install ldid


      # ==========================================
      # ROOT HIDE THEOS
      # ==========================================

      - name: Install RootHide Theos
        run: |
          set -e

          git clone --recursive \
            https://github.com/roothide/theos.git \
            "$GITHUB_WORKSPACE/theos"

          echo "THEOS=$GITHUB_WORKSPACE/theos" \
            >> "$GITHUB_ENV"


      # ==========================================
      # THEOS SDKS
      # ==========================================

      - name: Download SDKs
        run: |
          set -e

          git clone --depth 1 \
            https://github.com/theos/sdks.git \
            "$GITHUB_WORKSPACE/sdks"


      # ==========================================
      # INSTALL IPHONEOS SDK
      # ==========================================

      - name: Install iPhoneOS SDK
        run: |
          set -e

          mkdir -p "$THEOS/sdks"

          SDK=$(find "$GITHUB_WORKSPACE/sdks" \
            -maxdepth 1 \
            -type d \
            -name "iPhoneOS*.sdk" \
            | sort -V \
            | tail -n 1)

          if [ -z "$SDK" ]; then
            echo "ERROR: iPhoneOS SDK not found."

            find "$GITHUB_WORKSPACE/sdks" \
              -maxdepth 2 \
              -type d \
              -name "*.sdk"

            exit 1
          fi

          echo "======================================"
          echo "Using SDK"
          echo "======================================"

          echo "$SDK"

          cp -R "$SDK" "$THEOS/sdks/"


      # ==========================================
      # VERIFY THEOS
      # ==========================================

      - name: Verify Theos
        run: |
          set -e

          echo "======================================"
          echo "THEOS"
          echo "======================================"

          echo "$THEOS"

          test -f \
            "$THEOS/makefiles/common.mk"

          echo "Theos OK."

          echo
          echo "======================================"
          echo "SDKs"
          echo "======================================"

          find "$THEOS/sdks" \
            -maxdepth 1 \
            -type d \
            -name "iPhoneOS*.sdk" \
            -print


      # ==========================================
      # BUILD ROOT HIDE DEB
      # ==========================================

      - name: Build RootHide DEB
        run: |
          set -e

          export THEOS="$GITHUB_WORKSPACE/theos"

          make clean

          make package \
            FINALPACKAGE=1 \
            THEOS_PACKAGE_SCHEME=roothide


      # ==========================================
      # VERIFY DEB STRUCTURE
      # ==========================================

      - name: Verify DEB structure
        run: |
          set -e

          DEB=$(find packages \
            -type f \
            -name "*.deb" \
            | head -n 1)

          if [ -z "$DEB" ]; then
            echo "ERROR: DEB not generated."
            exit 1
          fi

          echo
          echo "======================================"
          echo "DEB"
          echo "======================================"

          echo "$DEB"

          echo
          echo "======================================"
          echo "FILE INFORMATION"
          echo "======================================"

          file "$DEB"

          echo
          echo "======================================"
          echo "DEB ARCHIVE"
          echo "======================================"

          ar -t "$DEB"

          echo
          echo "======================================"
          echo "EXTRACT DEB"
          echo "======================================"

          rm -rf /tmp/shadump
          mkdir -p /tmp/shadump

          cd /tmp/shadump

          ar -x \
            "$GITHUB_WORKSPACE/$DEB"

          echo
          echo "Extracted:"
          ls -lah

          echo
          echo "======================================"
          echo "DATA ARCHIVE"
          echo "======================================"

          DATA=$(find /tmp/shadump \
            -maxdepth 1 \
            -type f \
            -name "data.tar.*" \
            | head -n 1)

          if [ -z "$DATA" ]; then
            echo "ERROR: data archive not found."
            exit 1
          fi

          echo "DATA:"
          echo "$DATA"

          echo
          echo "======================================"
          echo "PACKAGE FILES"
          echo "======================================"

          mkdir -p /tmp/shadump/root

          tar -xf "$DATA" \
            -C /tmp/shadump/root

          find /tmp/shadump/root \
            -type f \
            -print

          echo
          echo "======================================"
          echo "CHECK DYLIB"
          echo "======================================"

          DYLIB=$(find /tmp/shadump/root \
            -name "SHAHierarchyDump.dylib" \
            | head -n 1)

          if [ -z "$DYLIB" ]; then
            echo "ERROR: SHAHierarchyDump.dylib NOT FOUND."
            exit 1
          fi

          echo "DYLIB FOUND:"
          echo "$DYLIB"

          echo
          echo "======================================"
          echo "CHECK PLIST"
          echo "======================================"

          PLIST=$(find /tmp/shadump/root \
            -name "SHAHierarchyDump.plist" \
            | head -n 1)

          if [ -z "$PLIST" ]; then
            echo "ERROR: SHAHierarchyDump.plist NOT FOUND."
            exit 1
          fi

          echo "PLIST FOUND:"
          echo "$PLIST"

          echo
          echo "======================================"
          echo "PLIST CONTENT"
          echo "======================================"

          cat "$PLIST"

          echo
          echo "======================================"
          echo "DYLIB INFORMATION"
          echo "======================================"

          file "$DYLIB"

          echo
          echo "======================================"
          echo "SUCCESS"
          echo "======================================"

          echo "DEB contains:"
          echo "- SHAHierarchyDump.dylib"
          echo "- SHAHierarchyDump.plist"


      # ==========================================
      # UPLOAD DEB
      # ==========================================

      - name: Upload RootHide DEB
        uses: actions/upload-artifact@v4

        with:
          name: SHAHierarchyDump-RootHide-DEB

          path: packages/*.deb

          if-no-files-found: error
